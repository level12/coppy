# CONFIGURATION -------------------------
_min_copier_version: "9.5"
_answers_file: .copier-answers-py.yaml
_envops:
  autoescape: false
  keep_trailing_newline: true
_subdirectory: template
_jinja_extensions:
- copier_template_extensions.TemplateExtensionLoader
- src/coppy_extensions.py:CoppyExtension
_migrations:
  - command: coppy migrate before
    when: "{{ _stage == 'before' }}"
  - command: coppy migrate after
    when: "{{ _stage == 'after' }}"

# PROMPT --------------------------------
project_name:
  type: str
  help: Project name

gh_org:
  type: str
  help: GitHub Org

gh_repo:
  type: str
  help: GitHub
  default: "{{ project_name | slugify }}"

author_name:
  type: str
  help: Author name
  default: "{{ git_user_name() }}"

author_email:
  type: str
  help: Author email
  default: "{{ git_user_email() }}"

py_module:
  type: str
  help: Package import name (for `import NAME` in Python code)
  default: "{{ project_name | slugify('_') }}"

script_name:
  type: str
  help: CLI name if any (for use in the shell)
  default: "{{ py_module | slugify }}"

python_version:
  type: str
  help: Python version (major.minor only)
  default: '3.13'

python_version_min:
  type: str
  help: Minimum supported Python version (major.minor only)
  default: '{{ python_version }}'

use_gh_nox:
    type: bool
    default: true
    help: GitHub nox action for CI?

use_codecov:
    type: bool
    default: true
    when: "{{ use_gh_nox }}"
    help: Upload coverage from the GitHub nox action to Codecov?

use_circleci:
    type: bool
    default: "{% if use_gh_nox %}{% else %}true{% endif %}"
    help: CircleCI for CI?

use_rumdl:
    type: bool
    default: true
    help: rumdl for Markdown linting and formatting?

use_js_cooldown:
    type: bool
    default: true
    help: Add JavaScript package-manager cooldown configs?
